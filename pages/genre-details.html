<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genre — Thornfield Library</title>
  <meta name="description" content="A genre room in the Thornfield Library: atmospheric introduction, subgenre filters, featured volumes and the complete shelf.">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/genres.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-root="../">
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="site-header"></div>

  <main id="main">
    <noscript>
      <div class="wrap section">
        <div class="notice notice--warn">
          <p><strong>JavaScript is switched off.</strong> Genre rooms are rendered from the shared book data with vanilla JavaScript. Please enable it to open this room.</p>
        </div>
      </div>
    </noscript>

    <!-- One reusable template for all five genres. genres.js reads ?genre=
         (and optional ?sub=) from the URL and renders the whole room here.
         An unknown id shows the shared "not found" panel instead. -->
    <div id="genre-root"></div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/books.js" defer></script>
  <script src="../js/app.js" defer></script>
  <script src="../js/genres.js" defer></script>
</body>
</html>
